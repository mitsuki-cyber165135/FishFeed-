; =====================================================================
;  FishFeed — konfigurasi PlatformIO (VS Code)
;  Buka FOLDER "feeder" ini di VS Code dengan extension PlatformIO IDE.
;  Build: Ctrl+Alt+B   ·   Upload: Ctrl+Alt+U   ·   Monitor: Ctrl+Alt+S
; =====================================================================

[env:esp32dev]
platform = espressif32
board = esp32dev                 ; ESP32 Dev Module
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; Library dari registry PlatformIO (diunduh otomatis saat build pertama)
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.0.0   ; WAJIB v7 — kode memakai API JsonDocument v7
    bogde/HX711

; Opsional: aktifkan bila ingin log error lebih detail
; build_flags = -DCORE_DEBUG_LEVEL=1
